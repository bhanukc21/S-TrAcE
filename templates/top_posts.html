{% extends 'base.html' %}
{% block title %}Top Posts — {{ category }}{% endblock %}

{% block content %}
  <div class="card p-3 card-elevated">
    <h2 class="mb-3">Top Posts — {{ category }}</h2>
    <div class="list-group">
      {% for post in posts %}
        <div class="list-group-item list-group-item-action">
          <h5 class="mb-1">{{ post.title }}</h5>
        </div>
      {% else %}
        <div class="alert alert-info">No posts available for this category.</div>
      {% endfor %}
    </div>
    <div class="mt-3 text-center">
      <a href="/visualizations" class="btn btn-dark">View Visualizations</a>
    </div>
  </div>
{% endblock %}
