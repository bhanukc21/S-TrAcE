{% extends 'base.html' %}
{% block title %}Register — TrAcE{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-4 card-elevated">
        <h3 class="mb-3 text-center">Register</h3>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form action="/register" method="POST" id="registrationForm" onsubmit="return validateForm()">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="phone">Phone Number</label>
            <div class="input-group">
              <select id="countryCode" class="form-select" style="max-width:140px;" onchange="updatePhoneCode()">
                <option value="+1">+1</option>
                <option value="+44">+44</option>
                <option value="+91">+91</option>
                <option value="+61">+61</option>
                <option value="+55">+55</option>
              </select>
              <input class="form-control" type="tel" id="phoneNumber" name="phone" placeholder="1234567890" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" oninput="validatePassword()" required>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
            <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
          </div>
          <div class="d-grid">
            <button class="btn btn-dark">Register</button>
          </div>
        </form>
        <div class="mt-3 text-center"><a href="/login">Already registered? Login</a></div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script>
function updatePhoneCode(){
  var countryCodeSelect = document.getElementById("countryCode");
  var phoneNumberInput = document.getElementById("phoneNumber");
  phoneNumberInput.value = countryCodeSelect.value + "-";
}
function validatePassword(){
  var password = document.getElementById("password");
  var confirm = document.getElementById("confirm_password");
  if(password.value !== confirm.value){
    confirm.setCustomValidity("Passwords do not match");
  } else { confirm.setCustomValidity(""); }
}
function validateForm(){ validatePassword(); return document.getElementById('registrationForm').checkValidity(); }
</script>
{% endblock %}

        <input type="tel" id="phoneNumber" name="phone" placeholder="Format: 1234567890" pattern="\+?[0-9]{1,2}-?[0-9]{10}" required>


      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div>
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" oninput="validatePassword()" required>
      </div>
      <div class="terms">
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
      </div>
      <div class="error" id="password_error"></div>
      <div>
        <input type="submit" value="Register">
      </div>
      {% if error %}
    <p>{{ error }}</p>
{% endif %}

    </form>
    <div style="text-align: center;"><a href="/login">Already Registered click here to login</a></div>
    <div class="error" id="error_message"></div>
  </div>

  <script>
    function updatePhoneCode() {
      var countryCodeSelect = document.getElementById("countryCode");
      var selectedCountryCode = countryCodeSelect.options[countryCodeSelect.selectedIndex].value;
      var phoneNumberInput = document.getElementById("phoneNumber");
      phoneNumberInput.value = selectedCountryCode + "-";
    }

    function validatePassword() {
      var password = document.getElementById("password");
      var confirm_password = document.getElementById("confirm_password");
      var password_error = document.getElementById("password_error");

      if (password.value != confirm_password.value) {
        confirm_password.setCustomValidity("Passwords do not match");
        password_error.textContent = "Passwords do not match";
      } else {
        confirm_password.setCustomValidity("");
        password_error.textContent = "";
      }
    }

    function validateForm() {
      var password = document.getElementById("password");
      var confirm_password = document.getElementById("confirm_password");
      var password_error = document.getElementById("password_error");

      if (password.value != confirm_password.value) {
        confirm_password.setCustomValidity("Passwords do not match");
        password_error.textContent = "Passwords do not match";
        return false;
      } else {
        confirm_password.setCustomValidity("");
        password_error.textContent = "";
        return true;
      }
    }
   
    // Function to log console message without altering actual code
    function displayConsoleMessage(message) {
      console.log("Console message:", message);
    }

    // Add console messages at strategic points
    displayConsoleMessage("Registration page loaded!");

    // Add event listener to the form submit event
    document.getElementById("registrationForm").addEventListener("submit", function(event) {
      // Prevent the default form submission behavior

      // Get the input values
      var username = document.getElementById("username").value;
      // Log the username without disturbing actual code
      displayConsoleMessage("Username entered: " + username);

      // Perform form validation or submission
      // For demonstration purposes, we're not performing any validation here
      // Just logging a message to indicate the form submission
      displayConsoleMessage("Form submitted successfully!");
    });
  </script>

</body>
</html>
